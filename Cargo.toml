[package]
name = "unitray"
version = "0.1.0"
edition = "2021"
authors = ["Khuirul Huda <hello@khuirulhuda.my.id>"]
description = "Lightweight systemd service manager in your Linux system tray"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Khuirul-Huda/unitray"
keywords = ["systemd", "tray", "statusnotifieritem", "developer", "linux"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "Khuirul Huda <hello@khuirulhuda.my.id>"
copyright = "2026 Khuirul Huda <hello@khuirulhuda.my.id>"
license-file = ["LICENSE", "4"]
extended-description = """\
Unitray is an ultra-lightweight system tray controller for managing
local development services (MariaDB, PostgreSQL, Docker, Cloudflared)
on Linux desktops."""
depends = "$auto, systemd, python3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/unitray", "usr/bin/unitray", "755"],
    ["scripts/unitray-settings", "usr/bin/unitray-settings", "755"],
    ["data/unitray.desktop", "usr/share/applications/unitray.desktop", "644"],
    ["data/unitray-settings.desktop", "usr/share/applications/unitray-settings.desktop", "644"],
    ["data/unitray.desktop", "etc/xdg/autostart/unitray.desktop", "644"],
    ["data/unitray.service", "usr/lib/systemd/user/unitray.service", "644"],
    ["data/49-unitray.rules", "usr/share/polkit-1/rules.d/49-unitray.rules", "644"],
    ["config/unitray.toml", "etc/unitray/config.toml", "644"],
    ["data/unitray.png", "usr/share/pixmaps/unitray.png", "644"],
    ["data/icons/hicolor/16x16/apps/unitray.png", "usr/share/icons/hicolor/16x16/apps/unitray.png", "644"],
    ["data/icons/hicolor/22x22/apps/unitray.png", "usr/share/icons/hicolor/22x22/apps/unitray.png", "644"],
    ["data/icons/hicolor/24x24/apps/unitray.png", "usr/share/icons/hicolor/24x24/apps/unitray.png", "644"],
    ["data/icons/hicolor/32x32/apps/unitray.png", "usr/share/icons/hicolor/32x32/apps/unitray.png", "644"],
    ["data/icons/hicolor/48x48/apps/unitray.png", "usr/share/icons/hicolor/48x48/apps/unitray.png", "644"],
    ["data/icons/hicolor/64x64/apps/unitray.png", "usr/share/icons/hicolor/64x64/apps/unitray.png", "644"],
    ["data/icons/hicolor/128x128/apps/unitray.png", "usr/share/icons/hicolor/128x128/apps/unitray.png", "644"],
    ["data/icons/hicolor/256x256/apps/unitray.png", "usr/share/icons/hicolor/256x256/apps/unitray.png", "644"],
    ["data/icons/hicolor/512x512/apps/unitray.png", "usr/share/icons/hicolor/512x512/apps/unitray.png", "644"],
    ["README.md", "usr/share/doc/unitray/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/unitray", dest = "/usr/bin/unitray", mode = "755" },
    { source = "scripts/unitray-settings", dest = "/usr/bin/unitray-settings", mode = "755" },
    { source = "data/unitray.desktop", dest = "/usr/share/applications/unitray.desktop", mode = "644" },
    { source = "data/unitray-settings.desktop", dest = "/usr/share/applications/unitray-settings.desktop", mode = "644" },
    { source = "data/unitray.desktop", dest = "/etc/xdg/autostart/unitray.desktop", mode = "644" },
    { source = "data/unitray.service", dest = "/usr/lib/systemd/user/unitray.service", mode = "644" },
    { source = "data/49-unitray.rules", dest = "/usr/share/polkit-1/rules.d/49-unitray.rules", mode = "644" },
    { source = "config/unitray.toml", dest = "/etc/unitray/config.toml", mode = "644", config = true },
    { source = "data/unitray.png", dest = "/usr/share/pixmaps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/16x16/apps/unitray.png", dest = "/usr/share/icons/hicolor/16x16/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/22x22/apps/unitray.png", dest = "/usr/share/icons/hicolor/22x22/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/24x24/apps/unitray.png", dest = "/usr/share/icons/hicolor/24x24/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/32x32/apps/unitray.png", dest = "/usr/share/icons/hicolor/32x32/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/48x48/apps/unitray.png", dest = "/usr/share/icons/hicolor/48x48/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/64x64/apps/unitray.png", dest = "/usr/share/icons/hicolor/64x64/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/128x128/apps/unitray.png", dest = "/usr/share/icons/hicolor/128x128/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/256x256/apps/unitray.png", dest = "/usr/share/icons/hicolor/256x256/apps/unitray.png", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/unitray.png", dest = "/usr/share/icons/hicolor/512x512/apps/unitray.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/unitray/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/unitray/LICENSE", mode = "644", doc = true },
]
